# 家庭资产（iPhone）— XcodeGen 配置。重新生成工程：cd ios-app && xcodegen
# 个人签名（团队、bundle 前缀）在 gitignore 的 Config/Local.xcconfig 里，照 Config/Local.example.xcconfig 填。
# 数据是 Mac 上导出的只读快照（scripts/export_snapshot.py → Generated/snapshot.json），打包进 app 和小组件；
# app 里不联网，也可以用隔空投送导入更新的快照。
name: FamilyFinance
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  FamilyFinance:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      # app 图标：Icon Composer 文档（Liquid Glass，浅色/深色/着色由系统渲染），由 scripts/make_app_icon.py 生成
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Resources/LogoMark.png
        buildPhase: resources
      - path: Resources/LogoMarkDark.png
        buildPhase: resources
      - path: Generated/snapshot.json
        optional: true
        buildPhase: resources
      # 展示模式的示例数据（虚构家庭，scripts/make_demo.py --snapshot 生成）
      - path: Generated/demo-snapshot.json
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FF_BUNDLE_ID)
        PRODUCT_NAME: FamilyFinance
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/App-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 家庭资产
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        # 系统分享面板里的「存储图像」需要这条，否则一点就崩
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 把分享给家人的长图存到相册。
        # 退出展示模式要过面容 ID；没有这条，一验证就崩
        INFOPLIST_KEY_NSFaceIDUsageDescription: 退出展示模式、显示真实数据前确认是你本人。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/FamilyFinance.entitlements
    dependencies:
      - target: FamilyFinanceWidgets
  FamilyFinanceWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widgets
      - path: Sources/Shared
      - path: Resources/LogoMark.png
        buildPhase: resources
      - path: Resources/LogoMarkDark.png
        buildPhase: resources
      - path: Generated/snapshot.json
        optional: true
        buildPhase: resources
      # 展示模式的示例数据（虚构家庭，scripts/make_demo.py --snapshot 生成）
      - path: Generated/demo-snapshot.json
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FF_BUNDLE_ID).widgets
        PRODUCT_NAME: FamilyFinanceWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Widgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 家庭资产
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/FamilyFinance.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  FamilyFinanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FamilyFinance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FF_BUNDLE_ID).tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FamilyFinance.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FamilyFinance
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  FamilyFinance:
    build:
      targets:
        FamilyFinance: all
        FamilyFinanceTests: [test]
    test:
      targets:
        - FamilyFinanceTests
